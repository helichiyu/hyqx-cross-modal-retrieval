# 本地联调 profile：本机 MySQL + Redis + 6300 算子
# 凭据只从环境变量读取，不写入仓库；启动示例：
#   LOCAL_DB_PASSWORD=... java -jar ... --spring.profiles.active=local
# 注意：本 profile 放行全部路径，仅用于本机验证，不得用于任何共享/生产环境。
server:
  # 本机 8080 常被其它模块占用，本地联调固定用 18080
  port: '${LOCAL_SERVER_PORT:18080}'

spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: 'jdbc:mysql://127.0.0.1:3306/sd_data_engineering?autoReconnect=true&useUnicode=true&characterEncoding=UTF-8&useSSL=false&allowMultiQueries=true&allowPublicKeyRetrieval=true'
    username: '${LOCAL_DB_USER:cmr}'
    password: '${LOCAL_DB_PASSWORD:}'
  liquibase:
    enabled: true
  data:
    redis:
      # 主配置的哨兵段在 !local 环境才生效，本地直接连单机 Redis
      host: '${LOCAL_REDIS_HOST:127.0.0.1}'
      port: '${LOCAL_REDIS_PORT:6379}'
      database: 0
      password: '${LOCAL_REDIS_PASSWORD:}'

redis:
  listener:
    enable: false

hsmty:
  verify: 'http://127.0.0.1:1/permissions/verify'
  redirect: 'http://127.0.0.1:1/home'

router:
  whitelist:
    - "/**"

cmr:
  operator:
    base-url: 'http://127.0.0.1:6300'
  # 共享卷指向仓库根的数据集与运行时目录（jar 在 hsmty-cmr 下启动）
  volume:
    dataset: '../dataset'
    runtime: '../runtime'
  file:
    store: local
    local-root: ./data/files
  search:
    index-dir: 'runtime/demo_index'
  # 本机联调用加密密钥，仅 local profile；共享/生产必须经 CMR_CRYPTO_KEY 覆盖
  crypto:
    key: '${CMR_CRYPTO_KEY:local-dev-crypto-32bytes-012345678!}'

springdoc:
  swagger-ui:
    enabled: true
  api-docs:
    enabled: true
